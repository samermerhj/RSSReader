<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- تدرج جسم البرميل -->
    <linearGradient id="barrelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5D3A1A"/>
      <stop offset="30%" stop-color="#B87333"/>
      <stop offset="70%" stop-color="#CD853F"/>
      <stop offset="100%" stop-color="#8B4513"/>
    </linearGradient>
    <!-- تدرج الأطواق -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <!-- تدرج القطرة -->
    <radialGradient id="dropGrad" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#8B4513"/>
    </radialGradient>
    <!-- ظل -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- ظل أرضي -->
  <ellipse cx="100" cy="175" rx="55" ry="10" fill="#00000030"/>

  <!-- جسم البرميل الرئيسي -->
  <rect x="55" y="45" width="90" height="120" rx="8" ry="8" fill="url(#barrelGrad)" stroke="#3E1A00" stroke-width="2" filter="url(#shadow)"/>

  <!-- الأطواق المعدنية (4 حلقات) -->
  <rect x="52" y="60" width="96" height="6" rx="3" fill="url(#ringGrad)"/>
  <rect x="52" y="85" width="96" height="6" rx="3" fill="url(#ringGrad)"/>
  <rect x="52" y="110" width="96" height="6" rx="3" fill="url(#ringGrad)"/>
  <rect x="52" y="135" width="96" height="6" rx="3" fill="url(#ringGrad)"/>

  <!-- حافة الغطاء العلوي -->
  <rect x="65" y="30" width="70" height="18" rx="5" fill="url(#ringGrad)" stroke="#3E1A00" stroke-width="1.5"/>

  <!-- حافة الغطاء السفلي -->
  <rect x="65" y="162" width="70" height="12" rx="4" fill="url(#ringGrad)" stroke="#3E1A00" stroke-width="1.5"/>

  <!-- لمعة على البرميل -->
  <ellipse cx="80" cy="80" rx="15" ry="30" fill="#FFFFFF20" transform="rotate(-15,80,80)"/>

  <!-- قطرة النفط -->
  <circle cx="110" cy="130" r="12" fill="url(#dropGrad)" stroke="#FFD700" stroke-width="1.5"/>
  <ellipse cx="108" cy="126" rx="5" ry="4" fill="#FFFFFF40"/>
</svg>