name: Build RSSProxy (Windows)

on:
  workflow_dispatch:   # تشغيل يدوي فقط

jobs:
  build-proxy:
    runs-on: windows-latest   # استخدام خادم ويندوز

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Install Qt for Windows
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.15.2'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_mingw81'
        cache: true

    - name: Build proxy.exe
      run: |
        cd tools\rssproxy
        qmake proxy.pro
        mingw32-make
      shell: cmd

    - name: Upload Windows Executable
      uses: actions/upload-artifact@v4
      with:
        name: rssproxy-win
        path: tools\rssproxy\release\rssproxy.exe
