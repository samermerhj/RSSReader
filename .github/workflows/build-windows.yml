name: Build Windows Executable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    # ---------- الخطوة الجديدة: تثبيت OpenSSL رسمياً ----------
    - name: Install OpenSSL (for Windows 7 compatibility)
      run: choco install openssl --version=1.1.1.2100 -y
      shell: powershell

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.15.2'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_mingw81'
        cache: true

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release ..
      shell: bash

    - name: Build
      run: |
        cd build
        mingw32-make -j$(nproc)
      shell: bash

    - name: Deploy Qt dependencies (windeployqt)
      run: |
        cd build
        windeployqt.exe rssreader.exe
      shell: bash

    # ---------- نسخ OpenSSL من المسار المضمون ----------
    - name: Copy OpenSSL DLLs (for HTTPS support)
      run: |
        cd build
        cp "C:/Program Files/OpenSSL-Win64/bin/libcrypto-1_1-x64.dll" .
        cp "C:/Program Files/OpenSSL-Win64/bin/libssl-1_1-x64.dll" .
      shell: bash

    - name: Copy resources and translations
      run: |
        cd build
        cp -r ../resources .
        cp -r ../translations .
      shell: bash

    - name: Upload Deployed Folder (Portable ZIP)
      uses: actions/upload-artifact@v4
      with:
        name: windows-deployed
        path: build/